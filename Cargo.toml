[workspace]
resolver = "3"
members = ["donotredeem-shared", "ui", "desktop", "extension", "systemone", "scam-decider"]


[workspace.package]
license = "GPL-3.0-or-later"

[workspace.dependencies]
donotredeem-shared = { path = "donotredeem-shared" }
systemone = { path = "systemone" }
ui = { path = "ui" }

tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
thiserror = { version = "2.0.21" }
async-openai  = { version = "0.42.2", features = ["full"] }
dioxus = { version = "0.7.10" }
